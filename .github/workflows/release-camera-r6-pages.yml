name: Release experimental camera r6 Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.repository == 'aldaqrouqtaysir/plategauge' && github.ref == 'refs/tags/camera-experimental-r6' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Run release-validator synthetic unit tests
        run: python -m unittest discover -s release/camera-r6 -p test_verify_release.py -v
      - uses: ./release/camera-r6/delivery-action
      - uses: ./release/camera-r6/browser-action
      - name: Check web source and release harness types
        working-directory: web
        run: |
          pnpm typecheck
          pnpm exec tsc --project ../release/camera-r6/tsconfig.json
      - name: Serve the exact approved archive locally
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/pg-camera-local"
          cp -R "$RUNNER_TEMP/pg-camera-dist" "$RUNNER_TEMP/pg-camera-local/plategauge"
          python -m http.server 4199 --bind 127.0.0.1 --directory "$RUNNER_TEMP/pg-camera-local" > "$RUNNER_TEMP/pg-camera-server.log" 2>&1 &
          echo "PG_CAMERA_SERVER_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4199/plategauge/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify generated-camera flow with the real pinned ONNX model
        working-directory: web
        env:
          PLATEGAUGE_CAMERA_SMOKE_MODE: local
          PLATEGAUGE_CAMERA_SMOKE_INVENTORY: ${{ github.workspace }}/release/camera-r6/inventory.json
          PLATEGAUGE_CAMERA_SMOKE_ARTIFACTS: ${{ runner.temp }}/pg-camera-local-smoke
        run: pnpm exec playwright test --config ../release/camera-r6/playwright.live.config.ts
      - name: Stop the local server
        if: ${{ always() && env.PG_CAMERA_SERVER_PID != '' }}
        run: kill "$PG_CAMERA_SERVER_PID"
      - name: Preserve machine-readable generated-fixture test results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: camera-local-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pg-camera-local-smoke/report.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/pg-camera-dist

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Require the approved deployment destination
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: test "$DEPLOYED_URL" = 'https://aldaqrouqtaysir.github.io/plategauge/'

  verify-live:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Recheck immutable approval
        run: >-
          python release/camera-r6/verify_release.py approval --repo-root .
          --approval release/camera-r6/approval.json --expected-tag camera-experimental-r6 --require-tag
      - name: Verify every live file against the approved inventory without redirects
        run: >-
          python release/camera-r6/verify_release.py live --inventory release/camera-r6/inventory.json
          --url https://aldaqrouqtaysir.github.io/plategauge/
      - uses: ./release/camera-r6/browser-action
      - name: Check the public camera journey without using hardware or user images
        working-directory: web
        env:
          PLATEGAUGE_CAMERA_SMOKE_MODE: https
          PLATEGAUGE_CAMERA_SMOKE_INVENTORY: ${{ github.workspace }}/release/camera-r6/inventory.json
          PLATEGAUGE_CAMERA_SMOKE_ARTIFACTS: ${{ runner.temp }}/pg-camera-live-smoke
        run: pnpm exec playwright test --config ../release/camera-r6/playwright.live.config.ts
      - name: Preserve compact live-check results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: camera-live-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pg-camera-live-smoke/report.json
          if-no-files-found: warn
          retention-days: 30
