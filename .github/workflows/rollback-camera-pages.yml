name: Restore approved benchmark Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.repository == 'aldaqrouqtaysir/plategauge' && github.ref == 'refs/tags/camera-experimental-r1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - uses: ./release/camera/delivery-action
        with:
          purpose: rollback
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/pg-rollback-dist
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Require the approved recovery destination
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: test "$DEPLOYED_URL" = 'https://aldaqrouqtaysir.github.io/plategauge/'
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Verify all restored v1.0.2 files without rebuilding or moving its tag
        run: >-
          python release/camera/verify_release.py live --inventory release/camera/rollback-inventory.json
          --url https://aldaqrouqtaysir.github.io/plategauge/
