name: Release GitHub Pages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Approved v1.0.2 maintenance release tag
        required: true
        default: v1.0.2
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guard:
    if: ${{ github.event_name != 'release' || github.event.release.tag_name != 'camera-experimental-r1' }}
    name: Enforce the approved release gate
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.release.outputs.release_ref }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then tag="$INPUT_TAG"; fi
          test "$tag" = "v1.0.2"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Verify and package the approved artifact
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.guard.outputs.release_ref }}
          fetch-depth: 0
      - id: checkout
        name: Verify the approval-only release commit
        run: |
          set -euo pipefail
          parent_count="$(git rev-list --parents -n 1 HEAD | awk '{print NF - 1}')"
          test "$parent_count" -eq 1
          source_commit_sha="$(git rev-parse HEAD^)"
          changed_paths="$(git diff --name-only "$source_commit_sha" HEAD)"
          test "$changed_paths" = "release/gate-d-approval.json"
          echo "source_commit_sha=$source_commit_sha" >> "$GITHUB_OUTPUT"
      - name: Run the shared release-order verification
        uses: ./.github/actions/release-checks
        with:
          source-url: ${{ github.server_url }}/${{ github.repository }}/tree/${{ needs.guard.outputs.release_tag }}
          artifact-label: ${{ needs.guard.outputs.release_tag }}
      - name: Verify committed Gate D approval and frozen evidence
        run: >-
          uv run python scripts/verify_release_gate.py
          --repo-root .
          --approval release/gate-d-approval.json
          --expected-tag "${{ needs.guard.outputs.release_tag }}"
          --expected-source-commit "${{ steps.checkout.outputs.source_commit_sha }}"
      - name: Preserve the exact audited distribution for rollback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approved-static-dist-${{ needs.guard.outputs.release_tag }}
          path: web/dist
          if-no-files-found: error
          retention-days: 90
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/dist

  deploy:
    name: Deploy approved release
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify-live:
    name: Verify the deployed bytes and real-model replay
    needs: [guard, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.guard.outputs.release_ref }}
      - name: Download the exact audited rollback artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: approved-static-dist-${{ needs.guard.outputs.release_tag }}
          path: verified-dist
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Require the protected HTTPS Pages destination
        env:
          PUBLIC_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_URL"
          case "$PUBLIC_URL" in https://*) ;; *) echo "Pages URL must use HTTPS" >&2; exit 1;; esac
      - name: Verify every deployed file is byte-identical to the audited artifact
        env:
          PUBLIC_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PUBLIC_URL%/}"
          while IFS= read -r -d '' expected; do
            relative="${expected#verified-dist/}"
            url="$base/$relative"
            if [ "$relative" = "index.html" ]; then url="$base/"; fi
            mkdir -p "live-bytes/$(dirname "$relative")"
            curl --fail --silent --show-error --location --compressed "$url" -o "live-bytes/$relative"
            cmp --silent "$expected" "live-bytes/$relative"
          done < <(find verified-dist -type f -print0 | sort -z)
      - name: Install locked public-smoke dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for the live release check
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run deployed real-model inference and request-boundary checks
        working-directory: web
        env:
          PLATEGAUGE_PUBLIC_URL: ${{ needs.deploy.outputs.page_url }}
        run: pnpm test:public-smoke
      - name: Preserve post-deploy verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-verification-${{ needs.guard.outputs.release_tag }}
          path: |
            web/test-results
            live-bytes
          if-no-files-found: warn
          retention-days: 90
