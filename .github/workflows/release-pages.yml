name: Release GitHub Pages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Approved v1.0.0 release tag
        required: true
        default: v1.0.0
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guard:
    name: Enforce the approved release gate
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.release.outputs.release_ref }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then tag="$INPUT_TAG"; fi
          test "$tag" = "v1.0.0"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Verify and package the approved artifact
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.guard.outputs.release_ref }}
          fetch-depth: 0
      - id: checkout
        name: Verify the approval-only release commit
        run: |
          set -euo pipefail
          parent_count="$(git rev-list --parents -n 1 HEAD | awk '{print NF - 1}')"
          test "$parent_count" -eq 1
          source_commit_sha="$(git rev-parse HEAD^)"
          changed_paths="$(git diff --name-only "$source_commit_sha" HEAD)"
          test "$changed_paths" = "release/gate-d-approval.json"
          echo "source_commit_sha=$source_commit_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
          cache: pip
      - name: Install the locked Python environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.17
          uv sync --locked --all-extras
      - name: Verify browser benchmark evidence is canonical
        run: uv run python scripts/verify_web_benchmark_evidence.py verify --repo-root .
      - name: Verify committed Gate D approval and frozen evidence
        run: >-
          uv run python scripts/verify_release_gate.py
          --repo-root .
          --approval release/gate-d-approval.json
          --expected-tag "${{ needs.guard.outputs.release_tag }}"
          --expected-source-commit "${{ steps.checkout.outputs.source_commit_sha }}"
      - name: Run Python release checks
        run: |
          uv run ruff check .
          uv run mypy src scripts
          uv run python -m pytest --cov=plategauge --cov-branch --cov-report=term-missing
      - name: Audit Python dependencies and inventory licenses
        run: |
          mkdir -p release-scan-artifacts
          audit_status=0
          uv run pip-audit --skip-editable --format=json --output release-scan-artifacts/python-audit.json || audit_status=$?
          python -c "import json,pathlib,sys; report=json.loads(pathlib.Path('release-scan-artifacts/python-audit.json').read_text()); dependencies=report.get('dependencies',[]) if isinstance(report,dict) else None; skipped=sorted((item.get('name'),item.get('skip_reason')) for item in dependencies or [] if isinstance(item,dict) and 'skip_reason' in item); expected=[('plategauge','distribution marked as editable')]; sys.exit(f'unexpected unaudited Python dependencies: {skipped!r}') if not isinstance(dependencies,list) or skipped != expected else None"
          uv run pip-licenses --format=json > release-scan-artifacts/python-licenses.json
          python -c "import json,pathlib,sys; report=json.loads(pathlib.Path('release-scan-artifacts/python-licenses.json').read_text()); sys.exit('empty or invalid Python license inventory') if not isinstance(report,list) or not report else None"
          test "$audit_status" -eq 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install locked web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Audit JavaScript dependencies and inventory licenses
        working-directory: web
        run: |
          audit_status=0
          pnpm audit --audit-level=moderate --json > ../release-scan-artifacts/node-audit.json || audit_status=$?
          node -e "const r=require('../release-scan-artifacts/node-audit.json'); if(!r||typeof r!=='object'||r.error) process.exit(1)"
          pnpm licenses list --prod --json > ../release-scan-artifacts/node-licenses.json
          node -e "const r=require('../release-scan-artifacts/node-licenses.json'); if(!r||typeof r!=='object'||!Object.keys(r).length||r.error) process.exit(1)"
          test "$audit_status" -eq 0
      - name: Run web quality and unit checks
        working-directory: web
        run: pnpm lint && pnpm typecheck && pnpm test:unit
      - name: Install supported release-test browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run browser, privacy, and accessibility checks
        working-directory: web
        run: pnpm test:e2e
      - name: Run production-path ONNX integration check
        working-directory: web
        run: pnpm test:integration
      - name: Build the static release
        working-directory: web
        env:
          VITE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ needs.guard.outputs.release_tag }}
        run: pnpm build
      - name: Audit the exact static release allowlist and notices
        run: >-
          uv run python scripts/audit_release_bundle.py
          --repo-root .
          --bundle web/dist
          --output release-scan-artifacts/static-bundle-audit.json
      - name: Smoke-test the exact production dist from first navigation
        working-directory: web
        env:
          PLATEGAUGE_EXPECTED_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ needs.guard.outputs.release_tag }}
        run: pnpm test:production
      - name: Verify packaged model evidence is byte-identical
        run: |
          cmp --silent web/public/models/plategauge.onnx web/dist/models/plategauge.onnx
          cmp --silent web/public/models/release.json web/dist/models/release.json
      - name: Upload release scan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-scan-evidence-${{ needs.guard.outputs.release_tag }}
          path: release-scan-artifacts
          if-no-files-found: error
          retention-days: 90
      - name: Preserve the exact audited distribution for rollback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approved-static-dist-${{ needs.guard.outputs.release_tag }}
          path: web/dist
          if-no-files-found: error
          retention-days: 90
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/dist

  deploy:
    name: Deploy approved release
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify-live:
    name: Verify the deployed bytes and real-model replay
    needs: [guard, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.guard.outputs.release_ref }}
      - name: Download the exact audited rollback artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: approved-static-dist-${{ needs.guard.outputs.release_tag }}
          path: verified-dist
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Require the protected HTTPS Pages destination
        env:
          PUBLIC_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_URL"
          case "$PUBLIC_URL" in https://*) ;; *) echo "Pages URL must use HTTPS" >&2; exit 1;; esac
      - name: Verify every deployed file is byte-identical to the audited artifact
        env:
          PUBLIC_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PUBLIC_URL%/}"
          while IFS= read -r -d '' expected; do
            relative="${expected#verified-dist/}"
            url="$base/$relative"
            if [ "$relative" = "index.html" ]; then url="$base/"; fi
            mkdir -p "live-bytes/$(dirname "$relative")"
            curl --fail --silent --show-error --location --compressed "$url" -o "live-bytes/$relative"
            cmp --silent "$expected" "live-bytes/$relative"
          done < <(find verified-dist -type f -print0 | sort -z)
      - name: Install locked public-smoke dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for the live release check
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run deployed real-model inference and request-boundary checks
        working-directory: web
        env:
          PLATEGAUGE_PUBLIC_URL: ${{ needs.deploy.outputs.page_url }}
        run: pnpm test:public-smoke
      - name: Preserve post-deploy verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-verification-${{ needs.guard.outputs.release_tag }}
          path: |
            web/test-results
            live-bytes
          if-no-files-found: warn
          retention-days: 90
