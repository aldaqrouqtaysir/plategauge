name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-operations:
    name: Synthetic release operations and harness types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.20.0'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install locked checking tools without neural-model extras
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.17
          uv sync --locked --extra dev
          pnpm --dir web install --frozen-lockfile
      - name: Test bounded discovery and every preserved release validator
        run: |
          uv run python -m unittest discover -s tests/python -p test_release_operations.py -v
          uv run python scripts/verify_release_operations.py --phase synthetic
      - name: Check release Python and standalone browser harness types
        run: uv run python scripts/verify_release_operations.py --phase typing

  monitoring-tests:
    name: Synthetic monitoring tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Windows setup-python cannot supply 3.12.14; bootstrap as in portability CI.
          python-version: ${{ matrix.os == 'windows-latest' && '3.12.10' || '3.12.14' }}
      - name: Install only the pinned runtime manager and managed Python
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.12.17
          uv python install 3.12.14
      - name: Verify the exact managed interpreter without project discovery
        shell: bash
        run: >-
          uv run --no-project --no-config --offline --python 3.12.14 --managed-python
          python -c "import sys; assert sys.version_info[:3] == (3, 12, 14)"
      - name: Test scope, failure classification and workflow boundaries without network
        shell: bash
        run: >-
          uv run --no-project --no-config --offline --python 3.12.14 --managed-python
          python -m unittest discover -s tests/python -p test_monitor_documentation.py -v

  python:
    name: Python quality and tests
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
          cache: pip
      - name: Install the locked Python environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.17
          uv sync --locked --all-extras
      - name: Verify browser benchmark evidence is canonical
        run: uv run python scripts/verify_web_benchmark_evidence.py verify --repo-root .
      - name: Restore the exact static candidate built by the web job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-static-candidate
          path: web/dist
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy src scripts
      - name: Test with branch coverage
        run: uv run python -m pytest --cov=plategauge --cov-branch --cov-report=term-missing
      - name: Audit Python dependencies and inventory licenses
        if: ${{ !cancelled() }}
        run: |
          diagnostics="$(python scripts/prepare_release_diagnostics.py --repo-root . --temp-root "$RUNNER_TEMP" --scope "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}")"
          echo "PG_DIAGNOSTICS_DIR=$diagnostics" >> "$GITHUB_ENV"
          export PG_DIAGNOSTICS_DIR="$diagnostics"
          audit_status=0
          uv run pip-audit --skip-editable --format=json --output "$PG_DIAGNOSTICS_DIR/python-audit.json" || audit_status=$?
          python -c "import json,os,pathlib,sys; report=json.loads((pathlib.Path(os.environ['PG_DIAGNOSTICS_DIR']) / 'python-audit.json').read_text()); dependencies=report.get('dependencies',[]) if isinstance(report,dict) else None; skipped=sorted((item.get('name'),item.get('skip_reason')) for item in dependencies or [] if isinstance(item,dict) and 'skip_reason' in item); expected=[('plategauge','distribution marked as editable')]; sys.exit(f'unexpected unaudited Python dependencies: {skipped!r}') if not isinstance(dependencies,list) or skipped != expected else None"
          uv run pip-licenses --format=json > "$PG_DIAGNOSTICS_DIR/python-licenses.json"
          python -c "import json,os,pathlib,sys; report=json.loads((pathlib.Path(os.environ['PG_DIAGNOSTICS_DIR']) / 'python-licenses.json').read_text()); sys.exit('empty or invalid Python license inventory') if not isinstance(report,list) or not report else None"
          test "$audit_status" -eq 0
      - name: Upload Python scan evidence
        if: ${{ always() && env.PG_DIAGNOSTICS_DIR != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-scan-evidence
          path: ${{ env.PG_DIAGNOSTICS_DIR }}
          if-no-files-found: error

  checkout-portability:
    name: Evidence-byte portability (${{ matrix.os }})
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bootstrap-python: "3.12.14"
          - os: windows-latest
            bootstrap-python: "3.12.10"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.bootstrap-python }}
          cache: pip
      - name: Install the locked Python environment
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.17
          uv python install 3.12.14
          uv sync --locked --all-extras --python 3.12.14 --managed-python
          uv run python -c "import sys; assert sys.version_info[:3] == (3, 12, 14)"
      - name: Verify frozen browser evidence bytes
        shell: bash
        run: uv run python scripts/verify_web_benchmark_evidence.py verify --repo-root .
      - name: Restore the exact static candidate built by the web job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-static-candidate
          path: web/dist
      - name: Run focused provenance and release-integrity tests
        shell: bash
        run: >-
          uv run python -m pytest
          tests/python/test_data_audit.py
          tests/python/test_gate_d_audit.py
          tests/python/test_release_artifacts.py
          tests/python/test_release_bundle_audit.py
          tests/python/test_review_package.py
          tests/python/test_web_evidence.py
          tests/python/test_fold_amendment.py
          tests/python/test_preprocess_contract.py
          tests/python/test_release_gate.py
          tests/python/test_release_diagnostics.py

  web:
    name: Browser app quality and unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit JavaScript dependencies and inventory production licenses
        run: |
          diagnostics="$(python ../scripts/prepare_release_diagnostics.py --repo-root .. --temp-root "$RUNNER_TEMP" --scope "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}")"
          echo "PG_DIAGNOSTICS_DIR=$diagnostics" >> "$GITHUB_ENV"
          export PG_DIAGNOSTICS_DIR="$diagnostics"
          audit_status=0
          pnpm audit --audit-level=moderate --json > "$PG_DIAGNOSTICS_DIR/node-audit.json" || audit_status=$?
          node -e "const r=require(process.env.PG_DIAGNOSTICS_DIR+'/node-audit.json'); if(!r||typeof r!=='object'||r.error) process.exit(1)"
          pnpm licenses list --prod --json > "$PG_DIAGNOSTICS_DIR/node-licenses.json"
          node -e "const r=require(process.env.PG_DIAGNOSTICS_DIR+'/node-licenses.json'); if(!r||typeof r!=='object'||!Object.keys(r).length||r.error) process.exit(1)"
          test "$audit_status" -eq 0
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Static production build
        env:
          VITE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: pnpm build
      - name: Upload the exact static candidate for integrity tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-static-candidate
          path: web/dist
          if-no-files-found: error
      - name: Upload JavaScript scan evidence
        if: ${{ always() && env.PG_DIAGNOSTICS_DIR != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: javascript-scan-evidence
          path: ${{ env.PG_DIAGNOSTICS_DIR }}
          if-no-files-found: error

  browser:
    name: Browser, privacy, and accessibility tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install supported test browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: End-to-end, privacy, and axe checks
        run: pnpm test:e2e
      - name: Production-path ONNX integration check
        run: pnpm test:integration
      - name: Preserve browser diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: warn
          retention-days: 14

  camera-source-regression:
    name: Camera source regression (generated input, no deployment)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    env:
      PG_CAMERA_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Bind the source and isolate generated diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PG_CAMERA_SOURCE_COMMIT"
          diagnostics="$(python ../scripts/prepare_release_diagnostics.py --repo-root .. --temp-root "$RUNNER_TEMP" --scope "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}")"
          echo "PG_CAMERA_DIAGNOSTICS=$diagnostics" >> "$GITHUB_ENV"
          echo "PLATEGAUGE_CAMERA_CANDIDATE_ARTIFACTS=$diagnostics/generated-only" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_JSON_OUTPUT_NAME=$diagnostics/raw-report.json" >> "$GITHUB_ENV"
      - name: Install the locked environment and browser revisions
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build current-source camera candidate, never the released artifact
        env:
          VITE_SOURCE_URL: https://github.com/aldaqrouqtaysir/plategauge/tree/${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm build:camera
      - name: Run every camera-source scenario on all three engines
        run: pnpm exec playwright test --config playwright.camera-candidate.config.ts --reporter=list,json
      - name: Create an allowlisted metadata-only result summary
        if: ${{ always() && env.PG_CAMERA_DIAGNOSTICS != '' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import re
          from pathlib import Path

          directory = Path(os.environ["PG_CAMERA_DIAGNOSTICS"])
          report = json.loads((directory / "raw-report.json").read_text(encoding="utf-8"))
          source = os.environ["PG_CAMERA_SOURCE_COMMIT"]
          if not re.fullmatch(r"[a-f0-9]{40}", source):
              raise ValueError("Invalid tested source identity")
          stats = report["stats"]
          safe_stats = {}
          for key in ("expected", "unexpected", "flaky", "skipped", "duration"):
              value = stats[key]
              if type(value) not in (int, float) or not math.isfinite(value) or value < 0:
                  raise ValueError("Invalid numeric test summary")
              if key != "duration" and type(value) is not int:
                  raise ValueError("Test counts must be integers")
              safe_stats[key] = value
          outcomes = {name: {status: 0 for status in ("expected", "unexpected", "flaky", "skipped")}
                      for name in ("chromium", "firefox", "webkit")}

          def collect(suite):
              for spec in suite.get("specs", []):
                  for test in spec["tests"]:
                      outcomes[test["projectName"]][test["status"]] += 1
              for child in suite.get("suites", []):
                  collect(child)

          for suite in report["suites"]:
              collect(suite)
          for status in ("expected", "unexpected", "flaky", "skipped"):
              if sum(engine[status] for engine in outcomes.values()) != safe_stats[status]:
                  raise ValueError("Engine outcomes do not match test totals")
          errors = report.get("errors", [])
          if not isinstance(errors, list):
              raise ValueError("Invalid runner error collection")
          summary = {
              "schemaVersion": 1,
              "scope": "current-source generated-camera regression; not release approval",
              "sourceCommit": source,
              "physicalDeviceEvidence": False,
              "accuracyValidation": False,
              "stats": safe_stats,
              "outcomesByEngine": outcomes,
              "runnerErrorCount": len(errors),
          }
          (directory / "summary.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          if errors or any(safe_stats[key] for key in ("unexpected", "flaky", "skipped")):
              raise ValueError("Camera regression did not complete with every scenario passing")
          if any(engine["expected"] == 0 for engine in outcomes.values()):
              raise ValueError("A required browser engine did not run")
          PY
      - name: Preserve only sanitized camera regression metadata
        if: ${{ always() && env.PG_CAMERA_DIAGNOSTICS != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: camera-source-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PG_CAMERA_DIAGNOSTICS }}/summary.json
          if-no-files-found: error
          retention-days: 30

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4 branch
        with:
          fail-on-severity: high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Isolate secret-scan diagnostics outside source
        shell: bash
        run: |
          diagnostics="$(python scripts/prepare_release_diagnostics.py --repo-root . --temp-root "$RUNNER_TEMP" --scope "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}")"
          echo "PG_DIAGNOSTICS_DIR=$diagnostics" >> "$GITHUB_ENV"
      - uses: ./.github/actions/secret-scan
        with:
          report-path: ${{ env.PG_DIAGNOSTICS_DIR }}/gitleaks.json
      - name: Preserve secret-scan diagnostics
        if: ${{ always() && env.PG_DIAGNOSTICS_DIR != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-scan-evidence
          path: ${{ env.PG_DIAGNOSTICS_DIR }}/gitleaks.json
          if-no-files-found: error

  release-rehearsal:
    name: Complete release-order rehearsal (no deployment)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require an unapproved source candidate
        run: test ! -e release/gate-d-approval.json
      - uses: ./.github/actions/release-checks
        with:
          source-url: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.event.pull_request.head.sha || github.sha }}
          artifact-label: rehearsal-${{ github.run_id }}
      - name: Preserve the rehearsed candidate (not release approval)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rehearsed-static-dist-${{ github.run_id }}
          path: web/dist
          if-no-files-found: error
          retention-days: 90
