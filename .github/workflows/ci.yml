name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality and tests
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
          cache: pip
      - name: Install the locked Python environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.17
          uv sync --locked --all-extras
      - name: Verify browser benchmark evidence is canonical
        run: uv run python scripts/verify_web_benchmark_evidence.py verify --repo-root .
      - name: Restore the exact static candidate built by the web job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-static-candidate
          path: web/dist
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy src scripts
      - name: Test with branch coverage
        run: uv run python -m pytest --cov=plategauge --cov-branch --cov-report=term-missing
      - name: Audit Python dependencies and inventory licenses
        run: |
          mkdir -p ci-artifacts
          audit_status=0
          uv run pip-audit --skip-editable --format=json --output ci-artifacts/python-audit.json || audit_status=$?
          python -c "import json,pathlib,sys; report=json.loads(pathlib.Path('ci-artifacts/python-audit.json').read_text()); dependencies=report.get('dependencies',[]) if isinstance(report,dict) else None; skipped=sorted((item.get('name'),item.get('skip_reason')) for item in dependencies or [] if isinstance(item,dict) and 'skip_reason' in item); expected=[('plategauge','distribution marked as editable')]; sys.exit(f'unexpected unaudited Python dependencies: {skipped!r}') if not isinstance(dependencies,list) or skipped != expected else None"
          uv run pip-licenses --format=json > ci-artifacts/python-licenses.json
          python -c "import json,pathlib,sys; report=json.loads(pathlib.Path('ci-artifacts/python-licenses.json').read_text()); sys.exit('empty or invalid Python license inventory') if not isinstance(report,list) or not report else None"
          test "$audit_status" -eq 0
      - name: Upload Python scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-scan-evidence
          path: ci-artifacts
          if-no-files-found: error

  checkout-portability:
    name: Evidence-byte portability (${{ matrix.os }})
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
          cache: pip
      - name: Install the locked Python environment
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.17
          uv sync --locked --all-extras
      - name: Verify frozen browser evidence bytes
        shell: bash
        run: uv run python scripts/verify_web_benchmark_evidence.py verify --repo-root .
      - name: Restore the exact static candidate built by the web job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-static-candidate
          path: web/dist
      - name: Run focused provenance and release-integrity tests
        shell: bash
        run: >-
          uv run python -m pytest
          tests/python/test_data_audit.py
          tests/python/test_gate_d_audit.py
          tests/python/test_release_artifacts.py
          tests/python/test_release_bundle_audit.py
          tests/python/test_review_package.py
          tests/python/test_web_evidence.py

  web:
    name: Browser app quality and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit JavaScript dependencies and inventory production licenses
        run: |
          mkdir -p ../ci-artifacts
          audit_status=0
          pnpm audit --audit-level=moderate --json > ../ci-artifacts/node-audit.json || audit_status=$?
          node -e "const r=require('../ci-artifacts/node-audit.json'); if(!r||typeof r!=='object'||r.error) process.exit(1)"
          pnpm licenses list --prod --json > ../ci-artifacts/node-licenses.json
          node -e "const r=require('../ci-artifacts/node-licenses.json'); if(!r||typeof r!=='object'||!Object.keys(r).length||r.error) process.exit(1)"
          test "$audit_status" -eq 0
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Static production build
        env:
          VITE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: pnpm build
      - name: Upload the exact static candidate for integrity tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-static-candidate
          path: web/dist
          if-no-files-found: error
      - name: Upload JavaScript scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: javascript-scan-evidence
          path: ci-artifacts
          if-no-files-found: error

  browser:
    name: Browser, privacy, and accessibility tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install supported test browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: End-to-end, privacy, and axe checks
        run: pnpm test:e2e
      - name: Production-path ONNX integration check
        run: pnpm test:integration

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4 branch
        with:
          fail-on-severity: high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
