[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "plategauge"
version = "1.0.0"
description = "Local-browser category-shift benchmark and failure explorer for food-leftover estimation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Taysir Al Daqrouq" }]
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=12.3,<13",
]

[project.optional-dependencies]
data = ["openpyxl>=3.1,<4"]
train = [
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
  "timm>=1.0.9,<2",
]
export = [
  "onnx>=1.16,<2",
  "onnxruntime>=1.19,<2",
  "onnxscript>=0.5,<1",
]
dev = [
  "mypy>=1.11,<2",
  "pip-audit>=2.10,<3",
  "pip-licenses>=5.5,<6",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.6,<1",
]
all = [
  "openpyxl>=3.1,<4",
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
  "timm>=1.0.9,<2",
  "onnx>=1.16,<2",
  "onnxruntime>=1.19,<2",
  "onnxscript>=0.5,<1",
]

[project.scripts]
plategauge = "plategauge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/plategauge"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "--strict-config --strict-markers -ra"

[tool.coverage.run]
source = ["plategauge"]
branch = true
omit = [
  "src/plategauge/__main__.py",
  "src/plategauge/export.py",
  "src/plategauge/model.py",
  "src/plategauge/training.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise OptionalDependencyError",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["plategauge"]
warn_unused_configs = true
